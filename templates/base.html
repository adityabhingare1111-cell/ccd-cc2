<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>{% block title %}Student Attendance System{% endblock %}</title>
    <link rel="stylesheet" href="{{ url_for('static', filename='style.css') }}">
</head>
<body>
    <header class="topbar">
        <div class="container topbar-inner">
            <a class="brand" href="{{ url_for('index') }}">Student Attendance</a>
            <nav>
                <a href="{{ url_for('index') }}">All students</a>
                <a href="{{ url_for('api_students') }}">API</a>
            </nav>
        </div>
    </header>

    <main class="container">
        {% block content %}{% endblock %}
    </main>

    <footer class="footer">
        <div class="container">
            Running commit: <code>{{ commit }}</code> &middot; CSE30040 CCA 2
        </div>
    </footer>
</body>
</html>
