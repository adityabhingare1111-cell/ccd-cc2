name: CI/CD

on:
  push:            # every push, on any branch (so a broken feature branch goes red)
  pull_request:
    branches: [main]

permissions:
  contents: read

jobs:
  lint-and-test:
    runs-on: ubuntu-latest
    steps:
      - name: Check out code
        uses: actions/checkout@v4

      - name: Set up Python 3.12
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: requirements-dev.txt

      - name: Install dev dependencies
        run: pip install -r requirements-dev.txt

      - name: Lint with flake8
        run: flake8 .

      - name: Run tests
        run: pytest -v

  build:
    needs: lint-and-test
    runs-on: ubuntu-latest
    steps:
      - name: Check out code
        uses: actions/checkout@v4

      - name: Build Docker image
        run: docker build --build-arg GIT_SHA=${{ github.sha }} -t attendance-app .

      - name: Start container
        run: docker run -d --name attendance -p 5000:5000 attendance-app

      - name: Wait for the app to start
        run: |
          for i in $(seq 1 15); do
            if curl -fs http://localhost:5000/health > /dev/null; then
              echo "App is up"
              exit 0
            fi
            echo "Waiting... ($i)"
            sleep 2
          done
          echo "App did not start in time"
          docker logs attendance
          exit 1

      - name: Smoke test /health
        run: curl -f http://localhost:5000/health

      - name: Stop container
        if: always()
        run: docker rm -f attendance

  deploy:
    needs: build
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    steps:
      - name: Trigger Render deploy
        run: curl -fsS -X POST "${{ secrets.RENDER_DEPLOY_HOOK }}&ref=${{ github.sha }}"

  verify:
    needs: deploy
    runs-on: ubuntu-latest
    env:
      LIVE_URL: ${{ vars.LIVE_URL }}
    steps:
      - name: Wait until the live site runs this commit
        run: |
          EXPECTED="${GITHUB_SHA:0:7}"
          URL="${LIVE_URL%/}/health"
          echo "Waiting for $URL to report commit $EXPECTED"
          for i in $(seq 1 20); do
            LIVE=$(curl -fsS --max-time 30 "$URL" | jq -r '.commit' || echo "unreachable")
            echo "Attempt $i: live commit is $LIVE"
            if [ "$LIVE" = "$EXPECTED" ]; then
              echo "Live site is running $EXPECTED"
              exit 0
            fi
            sleep 15
          done
          echo "Live site never reported commit $EXPECTED"
          exit 1
